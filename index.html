<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>__OG_TITLE__</title>
    <meta name="title" content="__OG_TITLE__" />
    <meta name="description" content="__OG_DESCRIPTION__" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__OG_URL__" />
    <meta property="og:title" content="__OG_TITLE__" />
    <meta property="og:description" content="__OG_DESCRIPTION__" />

    <meta property="og:image:type" content="image/png" />

    <meta property="twitter:card" content="summary_large_image" />

    <meta property="twitter:description" content="__OG_DESCRIPTION__" />
    <meta property="twitter:image" content="__OG_IMAGE__" />
